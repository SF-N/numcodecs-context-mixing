[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numcodecs-context-mixing"
version = "0.1.0"
description = "Context-mixing arithmetic coding of integer and boolean arrays for the `numcodecs` buffer compression API"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = [
    "leb128~=1.0.8",
    "numcodecs>=0.13.0,<0.17",
    "numba>=0.60",
    "numpy~=2.0",
    "typing-extensions~=4.6",
]

[dependency-groups]
dev = ["mypy~=1.14", "pytest~=8.3"]

[project.entry-points."numcodecs.codecs"]
"context_mixing.bitmap" = "numcodecs_context_mixing:ContextMixingBitmapCodec"
"context_mixing.symbols" = "numcodecs_context_mixing:ContextMixingSymbolCodec"
"context_mixing.residuals" = "numcodecs_context_mixing:ContextMixingResidualCodec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"numcodecs_context_mixing" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[[tool.mypy.overrides]]
module = ["leb128.*", "numcodecs.*", "numba.*"]
follow_untyped_imports = true
